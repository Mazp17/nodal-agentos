name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-please.yml dispatches it on the release PR, whose pushes don't trigger pull_request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # macOS only for now: the keychain backend (keyring apple-native) and the Terminal integration.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Minimum Rust line coverage. PRs that drop below it fail.
      COVERAGE_MIN: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` runs the native-dialogs lint and tsc, and produces dist/,
      # which tauri::generate_context! needs to compile the Rust crate.
      - name: Typecheck and build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust tests with coverage
        working-directory: src-tauri
        run: cargo llvm-cov --lib --locked --json --summary-only --output-path ../coverage.json

      - name: Coverage summary
        env:
          # On PRs GITHUB_SHA is the merge commit; show the PR head the numbers belong to.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir coverage
          .github/scripts/coverage-summary.sh coverage.json "$COVERAGE_MIN" > coverage/coverage.md
          echo "_Commit ${COMMIT::7}_" >> coverage/coverage.md
          cat coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so the comment is posted by coverage-comment.yml.
      - name: Save PR number for the coverage comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > coverage/pr-number

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Coverage threshold
        run: |
          lines=$(jq '.data[0].totals.lines.percent' coverage.json)
          echo "Line coverage: $lines% (minimum $COVERAGE_MIN%)"
          jq -e --argjson min "$COVERAGE_MIN" '.data[0].totals.lines.percent >= $min' coverage.json > /dev/null \
            || { echo "::error::Line coverage $lines% is below the $COVERAGE_MIN% minimum"; exit 1; }
