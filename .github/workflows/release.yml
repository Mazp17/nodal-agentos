name: Release

# Pushing a tag vX.Y.Z builds a universal, ad-hoc signed (not notarized) .dmg and
# creates a DRAFT pre-release with the notes from CHANGELOG.md. Publishing is manual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tag, version and changelog
        run: |
          version=$(jq -r .version package.json)
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG does not match package.json version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # No cache on purpose: release builds start clean.
      - name: Build universal .dmg
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Checksum and release notes
        run: |
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Nodal_${VERSION}_universal.dmg"
          mkdir dist-release
          cp "$dmg" dist-release/
          (cd dist-release && shasum -a 256 "Nodal_${VERSION}_universal.dmg" > "Nodal_${VERSION}_universal.dmg.sha256")
          # Section of CHANGELOG.md for this version, plus the install note for an unsigned app.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-install-note.md >> notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist-release/* \
            --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "Nodal $VERSION" --notes-file notes.md --verify-tag
