[package]
name = "nodal-store"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nodal-domain = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
nodal-domain = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
criterion = { version = "0.8", default-features = false }

[features]
test-support = ["nodal-domain/test-support"]

[[bench]]
name = "queries"
harness = false
required-features = ["test-support"]

[[bench]]
name = "contention"
harness = false
required-features = ["test-support"]
