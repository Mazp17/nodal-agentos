[package]
name = "nodal-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nodal-domain = { workspace = true }
tokio = { workspace = true, features = ["rt", "process", "io-util", "time", "sync"] }
keyring = { workspace = true }
portable-pty = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nodal-domain = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
criterion = { version = "0.8", default-features = false }

[features]
test-support = ["nodal-domain/test-support"]

[[bench]]
name = "git_run"
harness = false
required-features = ["test-support"]

[[bench]]
name = "run_diff"
harness = false
required-features = ["test-support"]

[[bench]]
name = "transcript"
harness = false
required-features = ["test-support"]

[[bench]]
name = "catalog"
harness = false
required-features = ["test-support"]

[[bench]]
name = "stream_json"
harness = false
required-features = ["test-support"]
