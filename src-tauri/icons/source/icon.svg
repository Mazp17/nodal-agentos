<!-- Logo "Orbit" (concepto 1c de Claude Design), en la grilla de íconos de macOS: 824px de cuerpo sobre 1024.
     Paleta cálida de la UI: tokens brand-* y accent de src/styles/tokens.css. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0.329" y1="0.03" x2="0.671" y2="0.97">
      <stop offset="0" stop-color="#231f1c"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="183" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="181" fill="none" stroke="#ffecd6" stroke-opacity="0.11" stroke-width="4"/>
  <circle cx="512" cy="512" r="242.6" fill="none" stroke="#ffecd6" stroke-opacity="0.28" stroke-width="9.2"/>
  <circle cx="512" cy="512" r="91.6" fill="#ece7e1"/>
  <circle cx="512" cy="264.8" r="45.8" fill="#f28e42"/>
  <circle cx="713.4" cy="621.9" r="45.8" fill="#f28e42"/>
  <circle cx="310.6" cy="621.9" r="45.8" fill="#f28e42"/>
</svg>
