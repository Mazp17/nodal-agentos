[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
keyring = { version = "3", features = ["apple-native"] }
portable-pty = "0.9.0"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nodal-domain = { path = "crates/nodal-domain" }
nodal-store = { path = "crates/nodal-store" }
nodal-host = { path = "crates/nodal-host" }
nodal-linear = { path = "crates/nodal-linear" }
nodal-mcp-proto = { path = "crates/nodal-mcp-proto" }
nodal-app = { path = "crates/nodal-app" }

[package]
name = "nodal"
version = "0.6.0"
description = "Nodal — Agent OS for Claude"
authors = ["Nodal contributors"]
license = "MIT"
edition = "2021"
# `pnpm tauri dev` runs the app, not `nodal-mcp`.
default-run = "nodal"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nodal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "sync", "net"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "~2.4.0"
nodal-domain = { workspace = true }
nodal-store = { workspace = true }
nodal-host = { workspace = true }
nodal-linear = { workspace = true }
nodal-mcp-proto = { workspace = true }
nodal-app = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
nodal-domain = { workspace = true, features = ["test-support"] }
nodal-store = { workspace = true, features = ["test-support"] }
nodal-host = { workspace = true, features = ["test-support"] }
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# P18 (ADR-014): "unwind", not "abort" — a panic in a background worker (pump, sync, a
# chat's reader/supervisor task) fails only that tokio task/thread, and the existing
# poisoned-mutex (`unwrap_or_else(|p| p.into_inner())`) and `JoinError` recovery code
# actually gets exercised instead of being dead code the whole app dies before reaching.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Release codegen (lto, codegen-units=1) with symbols kept, for perf profiling
# (Instruments/samply/perf) against release-shaped code. Not shipped.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
